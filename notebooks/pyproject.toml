[project]
name = "notebooks"
version = "0.1.0"
description = "Local zero-shot video activity recognition experiments with X-CLIP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.4.3,<1",
    "opencv-python-headless>=4.11,<5",
    "numpy>=2,<3",
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<3",
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model_smoke: explicit local-cache checks using real X-CLIP weights",
]
