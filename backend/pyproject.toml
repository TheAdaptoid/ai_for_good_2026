[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Cap to the tested interpreter line for pinned torch.
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.4",
    "torch==2.8.0",
    "transformers==4.57.6",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.4.3,<1",
    "pillow>=10,<13",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
